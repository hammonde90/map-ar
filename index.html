<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    mindar-image="imageTargetSrc: test-cropped.mind; maxTrack: 1;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Arrow pointing straight ahead -->
      <a-entity position="0 -0.05 0.05">

       <!-- 3D arrow pointing away from the user -->
<a-entity
  position="0 -0.08 0.08"
  rotation="-65 0 0"
>

  <!-- Arrow shaft -->
  <a-cylinder
    color="#00c853"
    radius="0.055"
    height="0.32"
    position="0 0 0"
  ></a-cylinder>

  <!-- Arrow head -->
  <a-cone
    color="#00c853"
    radius-bottom="0.15"
    radius-top="0"
    height="0.22"
    position="0 0.27 0"
  ></a-cone>

      </a-entity>

    </a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

  </a-scene>

</body>
</html>

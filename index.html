<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }

    #destination-panel {
      position: fixed;
      top: max(15px, env(safe-area-inset-top));
      right: 15px;
      z-index: 9999;
      width: clamp(105px, 29vw, 145px);
      padding: 6px;
      color: white;
      background: rgba(0, 0, 0, 0.78);
      border: 2px solid white;
      border-radius: 10px;
      text-align: center;
      pointer-events: none;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.55);
    }

    #destination-label {
      margin-bottom: 5px;
      font-size: clamp(12px, 3.2vw, 15px);
      font-weight: bold;
    }

    #destination-image {
      display: block;
      width: 100%;
      max-height: 190px;
      object-fit: cover;
      border-radius: 5px;
    }

    #navigation-guide {
      position: fixed;
      left: 50%;
      bottom: max(
        7vh,
        calc(env(safe-area-inset-bottom) + 20px)
      );
      transform: translateX(-50%);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    #navigation-guide.visible {
      opacity: 1;
      visibility: visible;
    }

    #navigation-guide.left-route {
      left: 27%;
    }

    #distance-text {
      margin-bottom: 4px;
      padding: 8px 20px;
      color: white;
      background: linear-gradient(
        180deg,
        rgba(50, 50, 50, 0.95),
        rgba(0, 0, 0, 0.88)
      );
      border: 2px solid white;
      border-radius: 22px;
      font-size: clamp(18px, 5vw, 24px);
      font-weight: bold;
      white-space: nowrap;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.55);
    }

    #arrow-svg {
      width: clamp(115px, 30vw, 155px);
      height: auto;
      overflow: visible;
    }

    .arrow-shape {
      display: none;
    }

    .arrow-shape.active {
      display: block;
    }

    #recognition-message {
      position: fixed;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      z-index: 10000;
      padding: 12px 22px;
      border-radius: 24px;
      color: white;
      background: rgba(0, 0, 0, 0.82);
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: bold;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      pointer-events: none;
    }

    #recognition-message.visible {
      opacity: 1;
      visibility: visible;
    }

    #final-screen {
      position: fixed;
      inset: 0;
      z-index: 11000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 30px;
      color: white;
      background: rgba(0, 0, 0, 0.85);
      font-size: clamp(24px, 7vw, 36px);
      font-weight: bold;
      text-align: center;
    }

    #final-screen.visible {
      display: flex;
    }
  </style>

  <script>
    const TEMPORARY_URL =
      "https://fp-michinoekishiga.com/";

    AFRAME.registerComponent("route-controller", {
      init: function () {
        const destinationPanel =
          document.querySelector("#destination-panel");

        const destinationImage =
          document.querySelector("#destination-image");

        const navigationGuide =
          document.querySelector("#navigation-guide");

        const distanceText =
          document.querySelector("#distance-text");

        const straightArrow =
          document.querySelector("#straight-arrow");

        const rightArrow =
          document.querySelector("#right-arrow");

        const recognitionMessage =
          document.querySelector("#recognition-message");

        const finalScreen =
          document.querySelector("#final-screen");

        const targets = [
          document.querySelector("#target-1"),
          document.querySelector("#target-2"),
          document.querySelector("#target-3"),
          document.querySelector("#target-4"),
          document.querySelector("#target-5")
        ];

        const urlParameters =
          new URLSearchParams(window.location.search);

        /*
          Reset the entire route:
          ?reset=1
        */
        if (urlParameters.get("reset") === "1") {
          localStorage.removeItem("hinoRouteStage");
        }

        /*
          Testing shortcut:

          ?stage=3 tests the manhole.
          ?stage=4 tests ushi.
        */
        if (urlParameters.has("stage")) {
          const testStage =
            Number(urlParameters.get("stage"));

          if (
            testStage >= 0 &&
            testStage <= 5
          ) {
            localStorage.setItem(
              "hinoRouteStage",
              String(testStage)
            );
          }
        }

        let stage = Number(
          localStorage.getItem("hinoRouteStage") || "0"
        );

        if (
          Number.isNaN(stage) ||
          stage < 0 ||
          stage > 5
        ) {
          stage = 0;

          localStorage.setItem(
            "hinoRouteStage",
            "0"
          );
        }

        let arrowTimer = null;
        let messageTimer = null;

        const updateDestinationImage = function () {
          if (stage === 0) {
            destinationImage.src =
              "destination1.webp?v=14";

            destinationPanel.style.display = "block";
          }

          if (stage === 1) {
            destinationImage.src =
              "destination2-guide.webp?v=14";

            destinationPanel.style.display = "block";
          }

          if (stage === 2) {
            destinationImage.src =
              "destination3-guide.webp?v=14";

            destinationPanel.style.display = "block";
          }

          /*
            No corner guide image is currently assigned
            to the manhole or ushi stages.
          */
          if (stage >= 3) {
            destinationPanel.style.display = "none";
          }
        };

        const hideArrow = function () {
          navigationGuide.classList.remove("visible");
          navigationGuide.classList.remove("left-route");

          clearTimeout(arrowTimer);
        };

        const showArrow = function (
          direction,
          text
        ) {
          clearTimeout(arrowTimer);

          distanceText.textContent = text;

          straightArrow.classList.remove("active");
          rightArrow.classList.remove("active");
          navigationGuide.classList.remove("left-route");

          if (direction === "straight") {
            straightArrow.classList.add("active");
            navigationGuide.classList.add("left-route");
          }

          if (direction === "right") {
            rightArrow.classList.add("active");
          }

          navigationGuide.classList.add("visible");

          arrowTimer = setTimeout(function () {
            hideArrow();
          }, 30000);
        };

        const showRecognizedMessage = function () {
          clearTimeout(messageTimer);

          recognitionMessage.classList.add("visible");

          messageTimer = setTimeout(function () {
            recognitionMessage.classList.remove("visible");
          }, 30000);
        };

        const openTemporaryPage = function () {
          setTimeout(function () {
            window.location.assign(TEMPORARY_URL);
          }, 700);
        };

        const completeCheckpoint = function (
          targetIndex
        ) {
          /*
            Destination 1
          */
          if (
            targetIndex === 0 &&
            stage === 0
          ) {
            stage = 1;

            localStorage.setItem(
              "hinoRouteStage",
              "1"
            );

            updateDestinationImage();
            showRecognizedMessage();

            showArrow(
              "straight",
              "400m先"
            );

            return;
          }

          /*
            Destination 2
          */
          if (
            targetIndex === 1 &&
            stage === 1
          ) {
            stage = 2;

            localStorage.setItem(
              "hinoRouteStage",
              "2"
            );

            updateDestinationImage();
            showRecognizedMessage();

            showArrow(
              "right",
              "470m"
            );

            return;
          }

          /*
            Destination 3

            Progress is saved, but the camera page
            remains available for the later targets.
          */
          if (
            targetIndex === 2 &&
            stage === 2
          ) {
            stage = 3;

            localStorage.setItem(
              "hinoRouteStage",
              "3"
            );

            hideArrow();
            updateDestinationImage();
            showRecognizedMessage();

            return;
          }

          /*
            Manhole
          */
          if (
            targetIndex === 3 &&
            stage === 3
          ) {
            stage = 4;

            localStorage.setItem(
              "hinoRouteStage",
              "4"
            );

            showRecognizedMessage();
            openTemporaryPage();

            return;
          }

          /*
            Ushi
          */
          if (
            targetIndex === 4 &&
            stage === 4
          ) {
            stage = 5;

            localStorage.setItem(
              "hinoRouteStage",
              "5"
            );

            showRecognizedMessage();
            openTemporaryPage();
          }
        };

        /*
          Accept the first valid detection immediately.
          This is intended to improve Android response.
        */
        const targetFound = function (
          targetIndex
        ) {
          if (targetIndex !== stage) {
            return;
          }

          completeCheckpoint(targetIndex);
        };

        targets.forEach(function (
          target,
          targetIndex
        ) {
          target.addEventListener(
            "targetFound",
            function () {
              targetFound(targetIndex);
            }
          );
        });

        updateDestinationImage();

        if (stage >= 5) {
          finalScreen.classList.add("visible");
        }
      }
    });
  </script>
</head>

<body>

  <div id="destination-panel">

    <div id="destination-label">
      この景色を神の目で見ろ
    </div>

    <img
      id="destination-image"
      src="destination1.webp?v=14"
      alt="次の目的地"
    >

  </div>

  <div id="navigation-guide">

    <div id="distance-text"></div>

    <svg
      id="arrow-svg"
      viewBox="0 0 280 300"
      aria-hidden="true"
    >
      <defs>

        <linearGradient
          id="gold-arrow"
          x1="0"
          y1="0"
          x2="1"
          y2="1"
        >
          <stop
            offset="0%"
            stop-color="#fff28a"
          />

          <stop
            offset="38%"
            stop-color="#ffc928"
          />

          <stop
            offset="72%"
            stop-color="#ff9900"
          />

          <stop
            offset="100%"
            stop-color="#e96600"
          />
        </linearGradient>

        <filter
          id="deep-shadow"
          x="-50%"
          y="-50%"
          width="200%"
          height="220%"
        >
          <feDropShadow
            dx="0"
            dy="10"
            stdDeviation="7"
            flood-color="#000000"
            flood-opacity="0.75"
          />
        </filter>

      </defs>

      <!-- Straight arrow -->
      <g
        id="straight-arrow"
        class="arrow-shape active"
        filter="url(#deep-shadow)"
        transform="rotate(-12 140 150)"
      >

        <path
          d="
            M140 10
            L260 130
            L195 130
            L195 280
            L85 280
            L85 130
            L20 130
            Z
          "
          transform="translate(0 13)"
          fill="#8d3f00"
          stroke="#502400"
          stroke-width="12"
          stroke-linejoin="round"
        />

        <path
          d="
            M140 10
            L260 130
            L195 130
            L195 280
            L85 280
            L85 130
            L20 130
            Z
          "
          fill="url(#gold-arrow)"
          stroke="#fff7cf"
          stroke-width="11"
          stroke-linejoin="round"
        />

        <path
          d="
            M140 31
            L229 120
            L177 120
            L177 252
          "
          fill="none"
          stroke="rgba(255,255,255,0.58)"
          stroke-width="10"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

      </g>

      <!-- Right-turn arrow -->
      <g
        id="right-arrow"
        class="arrow-shape"
        filter="url(#deep-shadow)"
      >

        <path
          d="
            M55 276
            L55 174
            Q55 80 150 80
            L196 80
          "
          transform="translate(0 13)"
          fill="none"
          stroke="#8d3f00"
          stroke-width="82"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="
            M183 15
            L270 80
            L183 145
            Z
          "
          transform="translate(0 13)"
          fill="#8d3f00"
          stroke="#502400"
          stroke-width="12"
          stroke-linejoin="round"
        />

        <path
          d="
            M55 276
            L55 174
            Q55 80 150 80
            L196 80
          "
          fill="none"
          stroke="#fff7cf"
          stroke-width="82"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="
            M55 276
            L55 174
            Q55 80 150 80
            L196 80
          "
          fill="none"
          stroke="url(#gold-arrow)"
          stroke-width="65"
          stroke-linecap="round"
          stroke-linejoin="round"
        />

        <path
          d="
            M183 15
            L270 80
            L183 145
            Z
          "
          fill="url(#gold-arrow)"
          stroke="#fff7cf"
          stroke-width="11"
          stroke-linejoin="round"
        />

        <path
          d="
            M39 251
            L39 169
            Q39 62 150 62
          "
          fill="none"
          stroke="rgba(255,255,255,0.55)"
          stroke-width="10"
          stroke-linecap="round"
        />

      </g>
    </svg>

  </div>

  <div id="recognition-message">
    目的地を見つけました
  </div>

  <div id="final-screen">
    すべての地点を見つけました
  </div>

  <a-scene
    route-controller
    mindar-image="imageTargetSrc: hino-route.mind?v=14; maxTrack: 1; warmupTolerance: 1; missTolerance: 15; filterMinCF: 0.0001; filterBeta: 10;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-entity
      id="target-1"
      mindar-image-target="targetIndex: 0"
    ></a-entity>

    <a-entity
      id="target-2"
      mindar-image-target="targetIndex: 1"
    ></a-entity>

    <a-entity
      id="target-3"
      mindar-image-target="targetIndex: 2"
    ></a-entity>

    <a-entity
      id="target-4"
      mindar-image-target="targetIndex: 3"
    ></a-entity>

    <a-entity
      id="target-5"
      mindar-image-target="targetIndex: 4"
    ></a-entity>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

  </a-scene>

</body>
</html>

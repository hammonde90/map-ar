<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.8/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene
    embedded
    vr-mode-ui="enabled: false"
    arjs="sourceType: webcam; debugUIEnabled: false;"
  >

    <a-marker
      type="pattern"
      url="marker.patt"
    >
      <a-entity
  position="0 0.05 0"
  rotation="0 0 0"
>
  <a-box
    position="-0.15 0 0"
    width="0.7"
    height="0.04"
    depth="0.16"
    color="#EC4E14"
  ></a-box>

  <a-triangle
    position="0.35 0.01 0"
    rotation="-90 0 0"
    vertex-a="-0.2 0.3 0"
    vertex-b="-0.2 -0.3 0"
    vertex-c="0.3 0 0"
    color="#EC4E14"
  ></a-triangle>
</a-entity>
    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
